<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img"
     aria-labelledby="ehTitle ehDesc" preserveAspectRatio="xMidYMid slice">
  <title id="ehTitle">Illustration of the event hall set for a banquet</title>
  <desc id="ehDesc">A stylised drawing of a large hall with round banquet tables, seated guests, tall arched windows and chandeliers.</desc>

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1D4A38"/>
      <stop offset="100%" stop-color="#153728"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8A6A45"/>
      <stop offset="55%" stop-color="#6B5236"/>
      <stop offset="100%" stop-color="#4E3B27"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBEFD4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#E7C98F" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE3AE" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFE3AE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#E4DAC6"/>
    </linearGradient>
    <linearGradient id="drape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A63A24"/>
      <stop offset="100%" stop-color="#7B2917"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#wall)"/>

  <!-- Tall arched windows, warm dusk light -->
  <g>
    <g fill="url(#pane)" stroke="#D8C49A" stroke-width="2.5">
      <path d="M96 200a76 76 0 0 1 152 0v300H96z"/>
      <path d="M324 200a76 76 0 0 1 152 0v300H324z"/>
      <path d="M724 200a76 76 0 0 1 152 0v300H724z"/>
      <path d="M952 200a76 76 0 0 1 152 0v300H952z"/>
    </g>
    <g stroke="#B79A6C" stroke-width="1.8" opacity="0.8">
      <path d="M172 126v374M96 318h152M400 126v374M324 318h152M800 126v374M724 318h152M1028 126v374M952 318h152"/>
    </g>
  </g>

  <!-- Draped backdrop and head table -->
  <g>
    <rect x="512" y="180" width="176" height="320" fill="url(#drape)" opacity="0.9"/>
    <g stroke="#C9A96A" stroke-width="2" opacity="0.55" fill="none">
      <path d="M540 180v320M600 180v320M660 180v320"/>
    </g>
    <circle cx="600" cy="330" r="110" fill="url(#glow)"/>
  </g>

  <!-- Floor -->
  <path d="M0 500h1200v400H0z" fill="url(#floor)"/>
  <g stroke="#A5825550" stroke-width="2">
    <path d="M0 560h1200M0 640h1200M0 740h1200M0 860h1200"/>
  </g>

  <!-- Chandeliers -->
  <g stroke="#C9A96A" stroke-width="2.5" fill="#FFE3AE">
    <g><path d="M300 0v78" opacity="0.8"/><ellipse cx="300" cy="94" rx="50" ry="17"/>
      <circle cx="266" cy="114" r="6"/><circle cx="300" cy="122" r="6"/><circle cx="334" cy="114" r="6"/>
      <circle cx="300" cy="96" r="82" fill="url(#glow)" stroke="none"/></g>
    <g><path d="M600 0v54" opacity="0.8"/><ellipse cx="600" cy="72" rx="62" ry="21"/>
      <circle cx="558" cy="96" r="7"/><circle cx="600" cy="106" r="7"/><circle cx="642" cy="96" r="7"/>
      <circle cx="600" cy="74" r="100" fill="url(#glow)" stroke="none"/></g>
    <g><path d="M900 0v78" opacity="0.8"/><ellipse cx="900" cy="94" rx="50" ry="17"/>
      <circle cx="866" cy="114" r="6"/><circle cx="900" cy="122" r="6"/><circle cx="934" cy="114" r="6"/>
      <circle cx="900" cy="96" r="82" fill="url(#glow)" stroke="none"/></g>
  </g>

  <!-- ==== Banquet tables ====
       Draw order per table: far chairs, far guests, tablecloth, near guests, near chairs. -->
  <g id="table-back-left" transform="translate(255 585) scale(0.72)">
    <g fill="#3B2A1B"><rect x="-158" y="-104" width="52" height="78" rx="10"/><rect x="-62" y="-118" width="52" height="78" rx="10"/><rect x="34" y="-118" width="52" height="78" rx="10"/><rect x="130" y="-104" width="52" height="78" rx="10"/></g>
    <g><circle cx="-132" cy="-118" r="21" fill="#E8C79A"/><rect x="-156" y="-100" width="48" height="60" rx="16" fill="#F0E4CE"/></g>
    <g><circle cx="-36" cy="-132" r="21" fill="#8D5B3C"/><rect x="-60" y="-114" width="48" height="60" rx="16" fill="#C44C34"/></g>
    <g><circle cx="60" cy="-132" r="21" fill="#E8C79A"/><rect x="36" y="-114" width="48" height="60" rx="16" fill="#2F6B51"/></g>
    <g><circle cx="156" cy="-118" r="21" fill="#7A4B2E"/><rect x="132" y="-100" width="48" height="60" rx="16" fill="#E3B24B"/></g>
    <ellipse cx="0" cy="6" rx="168" ry="54" fill="#2A1C10" opacity="0.45"/>
    <ellipse cx="0" cy="-6" rx="168" ry="54" fill="url(#cloth)"/>
    <g fill="#C9A96A"><rect x="-6" y="-46" width="12" height="26" rx="3"/><circle cx="0" cy="-52" r="9"/></g>
    <g fill="#1E4D3A" opacity="0.4"><circle cx="-84" cy="-4" r="8"/><circle cx="84" cy="-4" r="8"/></g>
    <g><circle cx="-92" cy="26" r="22" fill="#5C3A22"/><rect x="-118" y="46" width="52" height="56" rx="16" fill="#F0E4CE"/></g>
    <g><circle cx="92" cy="26" r="22" fill="#E8C79A"/><rect x="66" y="46" width="52" height="56" rx="16" fill="#3E6B8A"/></g>
  </g>

  <g id="table-back-right" transform="translate(945 585) scale(0.72)">
    <g fill="#3B2A1B"><rect x="-158" y="-104" width="52" height="78" rx="10"/><rect x="-62" y="-118" width="52" height="78" rx="10"/><rect x="34" y="-118" width="52" height="78" rx="10"/><rect x="130" y="-104" width="52" height="78" rx="10"/></g>
    <g><circle cx="-132" cy="-118" r="21" fill="#7A4B2E"/><rect x="-156" y="-100" width="48" height="60" rx="16" fill="#E3B24B"/></g>
    <g><circle cx="-36" cy="-132" r="21" fill="#E8C79A"/><rect x="-60" y="-114" width="48" height="60" rx="16" fill="#F0E4CE"/></g>
    <g><circle cx="60" cy="-132" r="21" fill="#8D5B3C"/><rect x="36" y="-114" width="48" height="60" rx="16" fill="#C44C34"/></g>
    <g><circle cx="156" cy="-118" r="21" fill="#E8C79A"/><rect x="132" y="-100" width="48" height="60" rx="16" fill="#2F6B51"/></g>
    <ellipse cx="0" cy="6" rx="168" ry="54" fill="#2A1C10" opacity="0.45"/>
    <ellipse cx="0" cy="-6" rx="168" ry="54" fill="url(#cloth)"/>
    <g fill="#C9A96A"><rect x="-6" y="-46" width="12" height="26" rx="3"/><circle cx="0" cy="-52" r="9"/></g>
    <g fill="#1E4D3A" opacity="0.4"><circle cx="-84" cy="-4" r="8"/><circle cx="84" cy="-4" r="8"/></g>
    <g><circle cx="-92" cy="26" r="22" fill="#E8C79A"/><rect x="-118" y="46" width="52" height="56" rx="16" fill="#3E6B8A"/></g>
    <g><circle cx="92" cy="26" r="22" fill="#5C3A22"/><rect x="66" y="46" width="52" height="56" rx="16" fill="#F0E4CE"/></g>
  </g>

  <g id="table-front" transform="translate(600 760)">
    <g fill="#3B2A1B"><rect x="-206" y="-118" width="60" height="88" rx="12"/><rect x="-96" y="-136" width="60" height="88" rx="12"/><rect x="36" y="-136" width="60" height="88" rx="12"/><rect x="146" y="-118" width="60" height="88" rx="12"/></g>
    <g><circle cx="-176" cy="-134" r="25" fill="#E8C79A"/><rect x="-206" y="-112" width="60" height="70" rx="18" fill="#C44C34"/></g>
    <g><circle cx="-66" cy="-152" r="25" fill="#5C3A22"/><rect x="-96" y="-130" width="60" height="70" rx="18" fill="#F0E4CE"/></g>
    <g><circle cx="66" cy="-152" r="25" fill="#E8C79A"/><rect x="36" y="-130" width="60" height="70" rx="18" fill="#E3B24B"/></g>
    <g><circle cx="176" cy="-134" r="25" fill="#8D5B3C"/><rect x="146" y="-112" width="60" height="70" rx="18" fill="#2F6B51"/></g>
    <ellipse cx="0" cy="10" rx="215" ry="70" fill="#2A1C10" opacity="0.45"/>
    <ellipse cx="0" cy="-6" rx="215" ry="70" fill="url(#cloth)"/>
    <g fill="#C9A96A"><rect x="-7" y="-58" width="14" height="32" rx="4"/><circle cx="0" cy="-66" r="12"/></g>
    <g fill="#1E4D3A" opacity="0.4"><circle cx="-108" cy="-2" r="10"/><circle cx="108" cy="-2" r="10"/></g>
    <g><circle cx="-112" cy="40" r="26" fill="#7A4B2E"/><rect x="-142" y="64" width="60" height="70" rx="18" fill="#3E6B8A"/></g>
    <g><circle cx="112" cy="40" r="26" fill="#E8C79A"/><rect x="82" y="64" width="60" height="70" rx="18" fill="#F0E4CE"/></g>
  </g>

  <!-- Foreground standing guests -->
  <g>
    <g><circle cx="92" cy="672" r="34" fill="#5C3A22"/><path d="M36 722c0-30 25-50 56-50s56 20 56 50v178H36z" fill="#123326"/></g>
    <g><circle cx="1110" cy="656" r="36" fill="#E8C79A"/><path d="M1050 708c0-31 27-52 60-52s60 21 60 52v192h-120z" fill="#1A2E24"/></g>
  </g>
</svg>
